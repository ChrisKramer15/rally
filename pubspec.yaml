publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  kiri_check: ^1.3.1
  flutter_lints: ^5.0.0
